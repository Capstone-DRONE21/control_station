name: Control Station CI

on:
  push:
    branches:
      - main
      - development
      - feature/**

  pull_request:
    branches:
      - main
      - development

  workflow_dispatch:

# Minimum permissions
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build